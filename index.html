<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oliver Trampos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b0b;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 35px 25px;
      background: #151515;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 170, 0, 0.15);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    p {
      color: #bdbdbd;
      margin-bottom: 30px;
    }

    .telegram {
      display: block;
      padding: 17px;
      border-radius: 12px;
      background: #229ED9;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .telegram:hover {
      transform: scale(1.03);
    }

    .aviso {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🔥 Oliver Trampos</h1>

    <p>Entre no nosso grupo e fique por dentro das novidades.</p>

    <a class="telegram" href="https://t.me/+Q78LEFowN5RjOWVh" target="_blank">
      🚀 ENTRAR NO GRUPO DO TELEGRAM
    </a>

    <div class="aviso">
      Acesso pelo Telegram
    </div>
  </div>

</body>
</html>

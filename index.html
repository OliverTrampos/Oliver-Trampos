<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oliver Trampos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        url('Oliver-trampo.png') center center / cover fixed no-repeat;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
    .container {
      width: 100%;
      max-width: 440px;
     background: #111111;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
      border: 3px solid #229ED9;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .descricao {
      color: #bdbdbd;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .info {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .info strong {
      display: block;
      font-size: 19px;
      margin-bottom: 7px;
    }

    .info span {
      color: #aaa;
      font-size: 14px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: 0.2s;
    }

    .telegram {
      background: #229ED9;
      color: white;
    }

    .perfil {
      background: transparent;
      color: white;
      border: 1px solid #444;
    }

    .botao:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .rodape {
      margin-top: 25px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo"
      style="
        margin-left:auto;
        margin-right:auto;
        background: linear-gradient(135deg, #229ED9, #1769aa);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:42px;
      ">
      🔥
    </div>

    <h1>Oliver Trampos</h1>

    <div class="descricao">
      Entre na nossa conexão e fique por dentro
      das novidades e oportunidades.
    </div>

    <div class="info">
      <strong>Conexão Oliver Trampos</strong>
      <span>Grupo oficial no Telegram</span>
    </div>

    <a
      class="botao telegram"
      href="https://t.me/+Q78LEFowN5RjOWVh"
      target="_blank"
      rel="noopener noreferrer">
      🚀 ENTRAR NO GRUPO DO TELEGRAM
    </a>

    <a
      class="botao perfil"
      href="https://t.me/Olivertrampos"
      target="_blank"
      rel="noopener noreferrer">
      👤 ACESSAR @Olivertrampos
    </a>

    <div class="rodape">
      © 2026 Oliver Trampos
    </div>

  </main>

</body>
</html>
